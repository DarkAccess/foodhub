<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodHub | Checkout</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav>

            <h1>🍴 FoodHub</h1>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="cart.html">🛒 Cart</a></li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="checkout">

            <h2>Place Your Order 🍔</h2>

            <p>Please enter your delivery information.</p>


            <form
                action="https://formspree.io/f/xeajgrky"
                method="POST">

                <label for="customer-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="customer-name"
                    name="customer_name"
                    placeholder="Enter your full name"
                    required>


                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="08012345678"
                    required>
                    <label for="email">
    Email Address
</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email address"
    required>


                <label for="address">
                    Delivery Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your delivery address"
                    required></textarea>
                    <label>Payment Method</label>

<div class="payment-options">

    <label>
        <input type="radio" name="payment_method" value="Pay Online" required>
        💳 Pay Online
    </label>

    <label>
        <input type="radio" name="payment_method" value="Cash on Delivery">
        💵 Cash on Delivery
    </label>

</div>


                <!-- JavaScript will put the order here -->

                <label for="order">
                    Your Order
                </label>

                <textarea
                    id="order"
                    name="order"
                    rows="8"
                    readonly></textarea>


                <button type="submit">
                    Place Order
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 FoodHub. All rights reserved.</p>

    </footer>


    <script src="https://js.paystack.co/v2/inline.js"></script>
<script src="js/script.js"></script>

</body>

</html>
